<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitget Grid Optimizer — Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2300d4aa'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white'>&#x1F4CA;</text></svg>">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --card:    #1a1d26;
      --accent:  #00d4aa;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --border:  #2d3148;
      --danger:  #f87171;
      --warn:    #fbbf24;
      --success: #4ade80;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .topbar-left { display: flex; align-items: center; gap: 0.9rem; }

    .topbar-logo {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .topbar-logo span { color: var(--accent); }

    .topbar-sep { color: var(--border); }

    .topbar-badge {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.18rem 0.5rem;
      border-radius: 100px;
      background: #f8717118;
      color: var(--danger);
      border: 1px solid #f8717144;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.8rem;
    }

    .topbar-email { color: var(--muted); }

    .btn-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
      transition: opacity 0.15s;
    }

    .btn-link:hover { opacity: 0.7; text-decoration: underline; }

    /* ── Layout ── */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 3rem;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }

    .section-title {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-refresh {
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* ── Metrics grid ── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .metric-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.2rem;
    }

    .metric-card .m-label {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .metric-card .m-value {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1;
      color: var(--text);
    }

    .metric-card .m-value.accent  { color: var(--accent); }
    .metric-card .m-value.danger  { color: var(--danger); }
    .metric-card .m-value.warn    { color: var(--warn); }

    /* ── Table ── */
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
    }

    .table-toolbar-title {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .table-search {
      background: #12151f;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.78rem;
      padding: 0.4rem 0.75rem;
      outline: none;
      width: 220px;
      transition: border-color 0.15s;
    }

    .table-search:focus { border-color: var(--accent); }
    .table-search::placeholder { color: var(--muted); }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      border-bottom: 1px solid var(--border);
    }

    th {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      padding: 0.65rem 1.1rem;
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 0.7rem 1.1rem;
      font-size: 0.82rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover { background: #ffffff06; }

    .td-email { color: var(--text); font-weight: 500; }
    .td-muted { color: var(--muted); }

    /* ── Role badge ── */
    .role-badge {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.18rem 0.5rem;
      border-radius: 100px;
    }

    .role-admin {
      background: #f8717118;
      color: var(--danger);
      border: 1px solid #f8717144;
    }

    .role-user {
      background: #64748b18;
      color: var(--muted);
      border: 1px solid #64748b44;
    }

    /* ── Status badge ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .status-active   .status-dot { background: var(--accent); }
    .status-inactive .status-dot { background: var(--muted); }
    .status-active   { color: var(--accent); }
    .status-inactive { color: var(--muted); }

    /* ── Action button ── */
    .btn-action {
      padding: 0.35rem 0.75rem;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-action:hover:not(:disabled)  { opacity: 0.8; transform: translateY(-1px); }
    .btn-action:active:not(:disabled) { transform: translateY(0); }

    .btn-action:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-deactivate {
      background: #f8717118;
      color: var(--danger);
      border: 1px solid #f8717144;
    }

    .btn-activate {
      background: #00d4aa18;
      color: var(--accent);
      border: 1px solid #00d4aa44;
    }

    /* ── Loading ── */
    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }

    .loading-row {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* ── Alert ── */
    .alert {
      padding: 0.6rem 0.9rem;
      border-radius: 7px;
      font-size: 0.78rem;
      line-height: 1.5;
      margin-top: 0.85rem;
    }

    .alert-success { background: #00d4aa18; border: 1px solid #00d4aa55; color: var(--accent); }
    .alert-error   { background: #f8717118; border: 1px solid #f8717155; color: var(--danger); }

    /* ── Last event chip ── */
    .event-chip {
      display: inline-block;
      font-size: 0.68rem;
      font-family: inherit;
      background: #2d314880;
      border-radius: 4px;
      padding: 0.18rem 0.45rem;
      color: var(--text);
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dot-live {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 0.3rem;
      animation: pulse 2s ease-in-out infinite;
      vertical-align: middle;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      th.hide-sm, td.hide-sm { display: none; }
      .table-search { width: 140px; }
    }
  </style>
</head>
<body x-data="adminApp()" x-init="init()">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">Bitget Grid <span>Optimizer</span></div>
      <span class="topbar-sep">/</span>
      <span class="topbar-badge">Admin</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-email" x-text="meEmail || '—'"></span>
      <a class="btn-link" href="dashboard.html">Dashboard</a>
      <a class="btn-link" href="/auth/logout">Esci</a>
    </div>
  </header>

  <main class="main">

    <!-- ── Section 1: Metriche globali ── -->
    <div class="section-header">
      <p class="section-title">Metriche globali</p>
      <span class="section-refresh">
        <span class="dot-live"></span>
        <span x-text="lastRefresh ? 'ultimo: ' + lastRefresh : 'in caricamento...'"></span>
      </span>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="m-label">Utenti totali</div>
        <div class="m-value" x-text="metrics.total_users ?? '—'"></div>
      </div>
      <div class="metric-card">
        <div class="m-label">Bot attivi</div>
        <div class="m-value accent" x-text="metrics.active_bots ?? '—'"></div>
      </div>
      <div class="metric-card">
        <div class="m-label">Shift oggi</div>
        <div class="m-value" x-text="metrics.shifts_today ?? '—'"></div>
      </div>
      <div class="metric-card">
        <div class="m-label">Fondi aggiunti oggi</div>
        <div class="m-value" x-text="metrics.funds_added_today ?? '—'"></div>
      </div>
      <div class="metric-card">
        <div class="m-label">Errori oggi</div>
        <div class="m-value" :class="(metrics.errors_today || 0) > 0 ? 'danger' : ''"
             x-text="metrics.errors_today ?? '—'"></div>
      </div>
    </div>

    <!-- ── Section 2: Utenti ── -->
    <div class="section-header" style="margin-bottom:0;">
      <p class="section-title">Utenti</p>
    </div>

    <template x-if="actionAlert">
      <div class="alert" :class="actionAlert.ok ? 'alert-success' : 'alert-error'"
           x-text="actionAlert.msg"></div>
    </template>

    <div style="margin-top:.85rem;">
      <div class="table-wrap">
        <div class="table-toolbar">
          <span class="table-toolbar-title">
            Elenco utenti
            <span style="color:var(--muted);font-weight:400;" x-text="'(' + filteredUsers.length + ')'"></span>
          </span>
          <input class="table-search" type="text" placeholder="Cerca email..." x-model="search" />
        </div>

        <template x-if="loadingUsers">
          <div class="loading-row"><span class="spinner"></span>Caricamento utenti...</div>
        </template>

        <template x-if="!loadingUsers && filteredUsers.length === 0">
          <div class="loading-row">Nessun utente trovato.</div>
        </template>

        <template x-if="!loadingUsers && filteredUsers.length > 0">
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>Email</th>
                  <th>Ruolo</th>
                  <th class="hide-sm">Bot</th>
                  <th class="hide-sm">Ultimo evento</th>
                  <th>Stato</th>
                  <th style="text-align:right;">Azioni</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="user in filteredUsers" :key="user.id">
                  <tr>
                    <!-- Email -->
                    <td>
                      <span class="td-email" x-text="user.email"></span>
                      <template x-if="user.email === meEmail">
                        <span style="font-size:0.65rem;color:var(--muted);margin-left:.4rem;">(tu)</span>
                      </template>
                    </td>

                    <!-- Ruolo -->
                    <td>
                      <span class="role-badge"
                            :class="user.role === 'admin' ? 'role-admin' : 'role-user'"
                            x-text="user.role || 'user'"></span>
                    </td>

                    <!-- Bot count -->
                    <td class="td-muted hide-sm" x-text="user.bot_count ?? 0"></td>

                    <!-- Ultimo evento -->
                    <td class="hide-sm">
                      <template x-if="user.last_event_ts">
                        <span class="event-chip" x-text="formatDate(user.last_event_ts)"></span>
                      </template>
                      <template x-if="!user.last_event_ts">
                        <span class="td-muted">—</span>
                      </template>
                    </td>

                    <!-- Stato -->
                    <td>
                      <span class="status-badge"
                            :class="user.active ? 'status-active' : 'status-inactive'">
                        <span class="status-dot"></span>
                        <span x-text="user.active ? 'Attivo' : 'Inattivo'"></span>
                      </span>
                    </td>

                    <!-- Azioni -->
                    <td style="text-align:right;">
                      <button
                        class="btn-action"
                        :class="user.active ? 'btn-deactivate' : 'btn-activate'"
                        :disabled="user.email === meEmail || toggling[user.id]"
                        :title="user.email === meEmail ? 'Non puoi modificare il tuo account' : ''"
                        @click="toggleUser(user)"
                      >
                        <template x-if="toggling[user.id]">
                          <span class="spinner" style="width:11px;height:11px;border-width:1.5px;"></span>
                        </template>
                        <span x-text="user.active ? 'Disattiva' : 'Attiva'"></span>
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

      </div>
    </div>

  </main>

  <script>
    function adminApp() {
      return {
        meEmail:      '',
        metrics:      {},
        users:        [],
        loadingUsers: true,
        search:       '',
        toggling:     {},
        actionAlert:  null,
        lastRefresh:  '',
        refreshTimer: null,

        get filteredUsers() {
          const q = this.search.trim().toLowerCase();
          if (!q) return this.users;
          return this.users.filter(u => (u.email || '').toLowerCase().includes(q));
        },

        async init() {
          // Auth check — must be admin
          try {
            const res = await fetch('/auth/me', { credentials: 'include' });
            if (!res.ok) { window.location.href = 'login.html'; return; }
            const me = await res.json();
            if (me.role !== 'admin') { window.location.href = 'dashboard.html'; return; }
            this.meEmail = me.email || '';
          } catch {
            window.location.href = 'login.html';
            return;
          }

          await this.loadAll();

          // Auto-refresh every 60 s
          this.refreshTimer = setInterval(() => this.loadAll(), 60000);
          window.addEventListener('pagehide', () => clearInterval(this.refreshTimer));
        },

        async loadAll() {
          await Promise.all([this.loadMetrics(), this.loadUsers()]);
          const now = new Date();
          this.lastRefresh = now.toLocaleTimeString('it-IT', {
            hour: '2-digit', minute: '2-digit', second: '2-digit'
          });
        },

        async loadMetrics() {
          try {
            const res = await fetch('/api/admin/metrics', { credentials: 'include' });
            if (res.ok) this.metrics = await res.json();
          } catch { /* silent */ }
        },

        async loadUsers() {
          try {
            const res = await fetch('/api/admin/users', { credentials: 'include' });
            if (res.ok) {
              this.users = await res.json();
            }
          } catch { /* silent */ }
          this.loadingUsers = false;
        },

        formatDate(ts) {
          if (!ts) return '—';
          try {
            return new Date(ts).toLocaleString('it-IT', {
              day: '2-digit', month: 'short', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            });
          } catch { return ts; }
        },

        async toggleUser(user) {
          // Guard: cannot toggle self
          if (user.email === this.meEmail) return;

          this.toggling = { ...this.toggling, [user.id]: true };
          this.actionAlert = null;

          try {
            const res = await fetch(`/api/admin/users/${user.id}/toggle`, {
              method: 'PUT',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' }
            });
            const data = await res.json().catch(() => ({}));

            if (res.ok) {
              // Optimistically update local state
              const idx = this.users.findIndex(u => u.id === user.id);
              if (idx !== -1) {
                this.users[idx] = { ...this.users[idx], active: !this.users[idx].active };
                // Force Alpine reactivity
                this.users = [...this.users];
              }
              this.actionAlert = {
                ok:  true,
                msg: data.message || `Utente ${user.email} ${user.active ? 'disattivato' : 'attivato'}.`
              };
            } else {
              this.actionAlert = {
                ok:  false,
                msg: data.detail || data.message || 'Errore nell\'aggiornamento.'
              };
            }
          } catch (e) {
            this.actionAlert = { ok: false, msg: 'Errore di rete: ' + e.message };
          } finally {
            const updated = { ...this.toggling };
            delete updated[user.id];
            this.toggling = updated;

            // Auto-dismiss alert after 4 s
            setTimeout(() => { this.actionAlert = null; }, 4000);
          }
        }
      };
    }
  </script>
</body>
</html>
