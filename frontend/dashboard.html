<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitget Grid Optimizer — Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2300d4aa'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white'>&#x1F4CA;</text></svg>">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --card:    #1a1d26;
      --accent:  #00d4aa;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --border:  #2d3148;
      --danger:  #f87171;
      --warn:    #fbbf24;
      --success: #4ade80;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .topbar-logo {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .topbar-logo span { color: var(--accent); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.8rem;
    }

    .topbar-email { color: var(--muted); }

    .btn-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
      transition: opacity 0.15s;
    }

    .btn-link:hover { opacity: 0.7; text-decoration: underline; }

    /* ── Layout ── */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .section-title {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* ── Summary cards ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
    }

    .summary-card .label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }

    .summary-card .value {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .value.positive { color: var(--accent); }
    .value.negative { color: var(--danger); }
    .value.neutral  { color: var(--text); }

    /* ── Bot cards ── */
    .bots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
      gap: 1.25rem;
    }

    @media (max-width: 600px) {
      .bots-grid { grid-template-columns: 1fr; }
    }

    .bot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .bot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.1rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .bot-symbol {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 100px;
    }

    .badge-active   { background: #00d4aa22; color: var(--accent); border: 1px solid #00d4aa55; }
    .badge-inactive { background: #64748b22; color: var(--muted);  border: 1px solid #64748b55; }
    .badge-warn     { background: #fbbf2422; color: var(--warn);   border: 1px solid #fbbf2455; }

    .bot-body { padding: 1rem 1.1rem; }

    /* ── Range bar ── */
    .range-bar-wrap { margin-bottom: 1rem; }

    .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .range-track {
      position: relative;
      height: 8px;
      background: #2d3148;
      border-radius: 100px;
    }

    .range-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      border-radius: 100px;
      background: var(--accent);
      opacity: 0.35;
    }

    .range-fill.warn { background: var(--warn); }

    .range-marker {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 1.5px var(--accent);
    }

    .range-marker.warn {
      background: var(--warn);
      box-shadow: 0 0 0 1.5px var(--warn);
    }

    .range-price-label {
      margin-top: 0.35rem;
      font-size: 0.72rem;
      color: var(--text);
      text-align: center;
    }

    /* ── Stats row ── */
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.2rem;
      font-size: 0.78rem;
      margin-bottom: 0.85rem;
    }

    .stat-item { color: var(--muted); }
    .stat-item strong { color: var(--text); }
    .stat-item .pos   { color: var(--accent); }
    .stat-item .neg   { color: var(--danger); }

    /* ── Chart ── */
    .chart-wrap {
      height: 60px;
      margin-bottom: 0.85rem;
    }

    /* ── Event / footer ── */
    .bot-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1.1rem;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
    }

    .event-text { color: var(--muted); }
    .event-text strong { color: var(--text); }

    /* ── Loading / empty ── */
    .loading-row {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    .refresh-indicator {
      font-size: 0.7rem;
      color: var(--muted);
      text-align: right;
      margin-bottom: 0.75rem;
    }

    .dot-live {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 0.35rem;
      animation: pulse 2s ease-in-out infinite;
      vertical-align: middle;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body x-data="dashApp()" x-init="init()">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-logo">Bitget Grid <span>Optimizer</span></div>
    <div class="topbar-right">
      <span class="topbar-email" x-text="userEmail || '—'"></span>
      <a class="btn-link" href="/auth/logout">Esci</a>
    </div>
  </header>

  <main class="main">

    <!-- Summary cards -->
    <p class="section-title">Riepilogo</p>
    <div class="summary-grid">
      <div class="summary-card">
        <div class="label">Bots attivi</div>
        <div class="value neutral" x-text="summary.active_bots ?? '—'"></div>
      </div>
      <div class="summary-card">
        <div class="label">PnL oggi</div>
        <div class="value"
             :class="pnlClass(summary.total_pnl_today)"
             x-text="formatPnl(summary.total_pnl_today)"></div>
      </div>
      <div class="summary-card">
        <div class="label">Shift oggi</div>
        <div class="value neutral" x-text="summary.shifts_today ?? '—'"></div>
      </div>
      <div class="summary-card">
        <div class="label">Fondi aggiunti oggi</div>
        <div class="value neutral" x-text="summary.funds_added_today ?? '—'"></div>
      </div>
    </div>

    <!-- Bots -->
    <div class="refresh-indicator">
      <span class="dot-live"></span>
      Aggiornamento automatico ogni 60s
      <template x-if="lastRefresh">
        — <span x-text="'ultimo: ' + lastRefresh"></span>
      </template>
    </div>

    <p class="section-title">Bot attivi</p>

    <template x-if="loadingBots">
      <div class="loading-row"><span class="spinner"></span>Caricamento bot...</div>
    </template>

    <template x-if="!loadingBots && bots.length === 0">
      <div class="loading-row">Nessun bot configurato. <a href="config.html" class="btn-link">Crea il primo bot</a>.</div>
    </template>

    <div class="bots-grid" x-show="!loadingBots && bots.length > 0">
      <template x-for="bot in bots" :key="bot.bot_id">
        <div class="bot-card">

          <!-- Header -->
          <div class="bot-header">
            <span class="bot-symbol" x-text="bot.symbol"></span>
            <div style="display:flex;align-items:center;gap:.5rem;">
              <template x-if="bot.ttm_squeeze">
                <span class="badge badge-warn">Mercato compresso</span>
              </template>
              <span class="badge"
                    :class="bot.active ? 'badge-active' : 'badge-inactive'"
                    x-text="bot.active ? 'ATTIVO' : 'INATTIVO'"></span>
            </div>
          </div>

          <!-- Body -->
          <div class="bot-body">

            <!-- Range bar -->
            <div class="range-bar-wrap">
              <div class="range-labels">
                <span x-text="'Lower: ' + formatNum(bot.lower_price)"></span>
                <span x-text="'Upper: ' + formatNum(bot.upper_price)"></span>
              </div>
              <div class="range-track">
                <div class="range-fill"
                     :class="isNearEdge(bot) ? 'warn' : ''"
                     :style="'width:' + clamp(pricePos(bot), 0, 100) + '%'"></div>
                <div class="range-marker"
                     :class="isNearEdge(bot) ? 'warn' : ''"
                     :style="'left:' + clamp(pricePos(bot), 0, 100) + '%'"></div>
              </div>
              <div class="range-price-label">
                Prezzo attuale: <strong x-text="formatNum(bot.price)"></strong>
                <template x-if="isNearEdge(bot)">
                  <span style="color:var(--warn);margin-left:.4rem;">[vicino al bordo]</span>
                </template>
              </div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
              <span class="stat-item">Grid: <strong x-text="bot.grid_num ?? '—'"></strong></span>
              <span class="stat-item">Investito: <strong x-text="(bot.invest_amount != null ? formatNum(bot.invest_amount) : '—') + ' USDT'"></strong></span>
              <span class="stat-item">PnL totale:
                <strong :class="(bot.total_pnl ?? 0) >= 0 ? 'pos' : 'neg'"
                        x-text="formatPnl(bot.total_pnl) + ' USDT'"></strong>
              </span>
              <span class="stat-item">PnL grid:
                <strong :class="(bot.grid_profit ?? 0) >= 0 ? 'pos' : 'neg'"
                        x-text="formatPnl(bot.grid_profit) + ' USDT'"></strong>
              </span>
            </div>

            <!-- Sparkline chart -->
            <div class="chart-wrap">
              <canvas :id="'chart-' + bot.bot_id" height="60"></canvas>
            </div>

          </div>

          <!-- Footer -->
          <div class="bot-footer">
            <span class="event-text" x-show="bot.last_event_type">
              Ultimo evento:
              <strong x-text="bot.last_event_type"></strong>
              —
              <span x-text="formatDate(bot.last_event_ts)"></span>
            </span>
            <span class="event-text" x-show="!bot.last_event_type">Nessun evento recente</span>
            <a class="btn-link" :href="'config.html?bot_id=' + bot.bot_id">Configurazione</a>
          </div>

        </div>
      </template>
    </div>

  </main>

  <script>
    // ─── Chart registry so we can destroy on re-render ───
    const chartInstances = {};

    function dashApp() {
      return {
        userEmail:   '',
        summary:     {},
        bots:        [],
        loadingBots: true,
        lastRefresh: '',
        refreshTimer: null,

        async init() {
          // Auth check
          try {
            const res = await fetch('/auth/me', { credentials: 'include' });
            if (!res.ok) { window.location.href = 'login.html'; return; }
            const me = await res.json();
            this.userEmail = me.email || '';
          } catch {
            window.location.href = 'login.html';
            return;
          }

          await this.loadAll();

          // Auto-refresh every 60 s
          this.refreshTimer = setInterval(() => this.loadAll(), 60000);
          window.addEventListener('pagehide', () => clearInterval(this.refreshTimer));
        },

        async loadAll() {
          await Promise.all([this.loadSummary(), this.loadBots()]);
          const now = new Date();
          this.lastRefresh = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        },

        async loadSummary() {
          try {
            const res = await fetch('/api/dashboard/summary', { credentials: 'include' });
            if (res.ok) this.summary = await res.json();
          } catch { /* silent */ }
        },

        async loadBots() {
          try {
            const res = await fetch('/api/dashboard/bots-status', { credentials: 'include' });
            if (res.ok) {
              this.bots = await res.json();
              this.loadingBots = false;
              // Charts render after DOM update
              this.$nextTick(() => {
                this.bots.forEach(bot => this.loadChart(bot));
              });
            }
          } catch {
            this.loadingBots = false;
          }
        },

        async loadChart(bot) {
          try {
            const res = await fetch(`/api/bots/${bot.bot_id}/pnl?hours=48`, { credentials: 'include' });
            if (!res.ok) return;
            const data = await res.json();

            const canvas = document.getElementById('chart-' + bot.bot_id);
            if (!canvas) return;

            // Destroy existing instance
            if (chartInstances[bot.bot_id]) {
              chartInstances[bot.bot_id].destroy();
            }

            const labels  = data.map(p => p.ts || '');
            const values  = data.map(p => p.total_pnl ?? 0);
            const isPos   = values[values.length - 1] >= (values[0] || 0);
            const lineClr = isPos ? '#00d4aa' : '#f87171';
            const fillClr = isPos ? '#00d4aa18' : '#f8717118';

            chartInstances[bot.bot_id] = new Chart(canvas.getContext('2d'), {
              type: 'line',
              data: {
                labels,
                datasets: [{
                  data: values,
                  borderColor: lineClr,
                  backgroundColor: fillClr,
                  borderWidth: 1.5,
                  fill: true,
                  tension: 0.35,
                  pointRadius: 0,
                  pointHoverRadius: 3,
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: { legend: { display: false }, tooltip: {
                  mode: 'index',
                  intersect: false,
                  callbacks: {
                    label: ctx => ' ' + ctx.parsed.y.toFixed(4) + ' USDT'
                  },
                  bodyFont: { family: 'Courier New, monospace', size: 11 },
                  titleFont: { family: 'Courier New, monospace', size: 10 },
                  backgroundColor: '#1a1d26',
                  borderColor: '#2d3148',
                  borderWidth: 1,
                }},
                scales: {
                  x: { display: false },
                  y: { display: false }
                }
              }
            });
          } catch { /* no chart data */ }
        },

        // ── Helpers ──
        pricePos(bot) {
          if (bot.price == null) return 50;
          const range = bot.upper_price - bot.lower_price;
          if (!range) return 50;
          return ((bot.price - bot.lower_price) / range) * 100;
        },

        isNearEdge(bot) {
          if (bot.price == null) return false;
          const pos = this.pricePos(bot);
          return pos < 5 || pos > 95;
        },

        clamp(v, min, max) {
          return Math.min(Math.max(v, min), max);
        },

        formatNum(v) {
          if (v == null) return '—';
          return Number(v).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },

        formatPnl(v) {
          if (v == null) return '—';
          const n = Number(v);
          return (n >= 0 ? '+' : '') + n.toFixed(4);
        },

        pnlClass(v) {
          if (v == null) return 'neutral';
          return Number(v) >= 0 ? 'positive' : 'negative';
        },

        formatDate(ts) {
          if (!ts) return '—';
          try {
            return new Date(ts).toLocaleString('it-IT', {
              day: '2-digit', month: 'short', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            });
          } catch { return ts; }
        }
      };
    }
  </script>
</body>
</html>
